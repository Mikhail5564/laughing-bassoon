<!-- templates/converter.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конвертер валют</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .converter-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #444;
        }
        .input-rub {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 18px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .input-rub:focus {
            outline: none;
            border-color: #667eea;
        }
        .currency-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 5px;
        }
        .currency-option {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            background: #fafafa;
        }
        .currency-option:hover {
            border-color: #667eea;
            background: #f0f2ff;
        }
        .currency-option input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #ccc;
            border-radius: 4px;
            margin-right: 15px;
            position: relative;
            flex-shrink: 0;
            transition: all 0.3s;
            cursor: pointer;
        }
        .currency-option input[type="checkbox"]:checked {
            border-color: #667eea;
            background: #667eea;
        }
        .currency-option input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            font-weight: bold;
        }
        .currency-icon {
            font-size: 32px;
            margin-right: 12px;
            width: 40px;
            text-align: center;
        }
        .currency-info {
            flex: 1;
        }
        .currency-name {
            font-weight: 500;
            color: #333;
        }
        .currency-rate {
            font-size: 13px;
            color: #888;
            margin-top: 2px;
        }
        .currency-rate span {
            color: #667eea;
            font-weight: 600;
        }
        .btn-convert {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-convert:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .btn-convert:active {
            transform: translateY(0);
        }
        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 12px;
            text-align: center;
        }
        .result-amount {
            font-size: 32px;
            font-weight: 700;
            color: #333;
        }
        .result-currency {
            font-size: 28px;
        }
        .result-label {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }
        .error {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
        }
        .hidden {
            display: none;
        }
        @media (max-width: 480px) {
            .converter-card {
                padding: 25px;
            }
            .currency-option {
                padding: 10px 14px;
            }
            .currency-icon {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="converter-card">
        <h1>💱 Конвертер валют</h1>
        <p class="subtitle">Перевод рублей в мировые валюты</p>

        <form method="post" id="converterForm" action="">
            {% csrf_token %}

            <div class="form-group">
                <label for="rub_amount">Сумма в рублях (₽)</label>
                <input
                    type="number"
                    id="rub_amount"
                    name="rub_amount"
                    class="input-rub"
                    placeholder="Введите сумму в рублях"
                    step="0.01"
                    min="0"
                    value="{{ rub_amount|default:'' }}"
                    required
                >
                {% if error %}
                    <div class="error">{{ error }}</div>
                {% endif %}
            </div>

            <div class="form-group">
                <label>Выберите валюту для конвертации</label>
                <div class="currency-options">
                    <!-- ДОЛЛАР -->
                    <label class="currency-option">
                        <input
                            type="checkbox"
                            name="currency"
                            value="USD"
                            class="currency-checkbox"
                            {% if selected_currency == 'USD' %}checked{% endif %}
                        >
                        <span class="currency-icon">💵</span>
                        <div class="currency-info">
                            <div class="currency-name">Доллар США</div>
                            <div class="currency-rate">
                                Курс: <span>1 USD = {{ usd }} ₽</span>
                            </div>
                        </div>
                    </label>

                    <!-- ЕВРО -->
                    <label class="currency-option">
                        <input
                            type="checkbox"
                            name="currency"
                            value="EUR"
                            class="currency-checkbox"
                            {% if selected_currency == 'EUR' %}checked{% endif %}
                        >
                        <span class="currency-icon">💶</span>
                        <div class="currency-info">
                            <div class="currency-name">Евро</div>
                            <div class="currency-rate">
                                Курс: <span>1 EUR = {{ eur }} ₽</span>
                            </div>
                        </div>
                    </label>

                    <!-- ЮАНЬ -->
                    <label class="currency-option">
                        <input
                            type="checkbox"
                            name="currency"
                            value="CNY"
                            class="currency-checkbox"
                            {% if selected_currency == 'CNY' %}checked{% endif %}
                        >
                        <span class="currency-icon">¥</span>
                        <div class="currency-info">
                            <div class="currency-name">Китайский юань</div>
                            <div class="currency-rate">
                                Курс: <span>1 CNY = {{ cny }} ₽</span>
                            </div>
                        </div>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn-convert">Конвертировать</button>
        </form>

        {% if res %}
            <div class="result">
                <div class="result-amount">
                    {{ res }} {{ currency }}
                </div>
                <div class="result-label">
                    Результат конвертации
                </div>
            </div>
        {% endif %}
    </div>

    <script>
        // Логика для работы чекбоксов как radio (только один выбор)
        document.addEventListener('DOMContentLoaded', function() {
            const checkboxes = document.querySelectorAll('.currency-checkbox');

            checkboxes.forEach(function(checkbox) {
                checkbox.addEventListener('change', function() {
                    if (this.checked) {
                        checkboxes.forEach(function(other) {
                            if (other !== checkbox) {
                                other.checked = false;
                            }
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
