<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин оружия — один предмет</title>
    <!-- Современный шрифт и базовые стили -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #1a1e1f 0%, #0d0f10 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 1.5rem;
            margin: 0;
        }

        .card {
            max-width: 480px;
            width: 100%;
            background: #22282a;
            border-radius: 2.5rem;
            padding: 2.2rem 2rem 2.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 140, 0.12);
            transition: transform 0.2s ease;
            backdrop-filter: blur(2px);
        }

        .card:hover {
            transform: scale(1.01);
        }

        /* шапка магазина */
        .shop-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.8rem;
            border-bottom: 1px solid rgba(255, 215, 140, 0.15);
            padding-bottom: 1rem;
        }

        .shop-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #f0e1c7;
            text-shadow: 0 2px 3px rgba(0,0,0,0.5);
        }

        .shop-header span {
            background: #b48b5a;
            color: #0d0f10;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.25rem 0.9rem;
            border-radius: 40px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            box-shadow: inset 0 -1px 2px rgba(0,0,0,0.3);
        }

        /* карточка товара */
        .product {
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .product-image {
            background: #2f373a;
            border-radius: 2rem;
            padding: 0.8rem 0 0.2rem 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 -6px 0 #15191a, 0 8px 18px rgba(0,0,0,0.5);
        }

        .product-image svg {
            display: block;
            width: 100%;
            max-width: 240px;
            height: auto;
            filter: drop-shadow(0 8px 12px #0a0c0d);
        }

        .product-details {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .product-name {
            font-size: 2rem;
            font-weight: 700;
            color: #f5ede1;
            letter-spacing: -0.02em;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .product-name small {
            font-size: 0.9rem;
            font-weight: 400;
            background: #3b4346;
            padding: 0.25rem 1rem;
            border-radius: 40px;
            color: #d6cdbc;
            letter-spacing: 0.2px;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.04);
        }

        .price-block {
            background: #1e2528;
            border-radius: 1.8rem;
            padding: 0.9rem 1.5rem;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.5rem 0.3rem;
            border: 1px solid #3b4549;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.6);
        }

        .price-label {
            color: #a7b3b0;
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .price-value {
            font-size: 2.4rem;
            font-weight: 700;
            color: #f5d7b3;
            letter-spacing: 0.5px;
            text-shadow: 0 0 6px rgba(245, 215, 179, 0.15);
        }

        .price-value .currency {
            font-size: 1.5rem;
            font-weight: 600;
            color: #b99e7a;
            margin-left: 0.2rem;
        }

        .stock-block {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a2124;
            border-radius: 2rem;
            padding: 0.7rem 1.5rem 0.7rem 1.8rem;
            border-left: 4px solid #b48b5a;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .stock-label {
            color: #b8c5c0;
            font-weight: 500;
            font-size: 1rem;
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stock-label::before {
            content: "•";
            font-size: 1.8rem;
            color: #b48b5a;
            line-height: 1;
        }

        .stock-count {
            font-size: 1.6rem;
            font-weight: 700;
            color: #e8ddd0;
            background: #2e383c;
            padding: 0.1rem 1.2rem;
            border-radius: 60px;
            letter-spacing: 0.5px;
            box-shadow: inset 0 2px 3px rgba(0,0,0,0.4);
        }

        .stock-count span {
            font-size: 1rem;
            font-weight: 400;
            color: #9aaba6;
            margin-left: 0.3rem;
        }

        .badge-limited {
            display: inline-block;
            background: #a5513a;
            color: #f5e7d9;
            font-weight: 600;
            font-size: 0.75rem;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            box-shadow: inset 0 -2px 0 #6d3728;
        }

        /* кнопка (декоративная) */
        .action-btn {
            margin-top: 0.8rem;
            background: #b48b5a;
            border: none;
            border-radius: 3rem;
            padding: 1rem 1.8rem;
            font-weight: 700;
            font-size: 1.2rem;
            color: #141819;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            box-shadow: 0 6px 0 #6f5333, 0 6px 14px rgba(0,0,0,0.4);
            transition: 0.08s linear;
            cursor: default;
            letter-spacing: 0.4px;
        }

        .action-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #6f5333;
        }

        .action-btn svg {
            width: 22px;
            height: 22px;
            fill: #1a1e1f;
        }

        .footer-note {
            margin-top: 1.2rem;
            text-align: center;
            color: #6f7e7a;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            border-top: 1px solid #2f383b;
            padding-top: 1.2rem;
        }

        /* адаптив */
        @media (max-width: 480px) {
            .card { padding: 1.8rem 1.2rem; }
            .product-name { font-size: 1.8rem; }
            .price-value { font-size: 2rem; }
            .stock-count { font-size: 1.4rem; padding: 0.1rem 1rem; }
            .shop-header h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Шапка магазина -->
        <div class="shop-header">
            <h1>⚔️ Оружейная</h1>
            <span>один предмет</span>
        </div>

        <!-- Товар (единственный) -->
        <div class="product">
            <!-- Иконка/изображение оружия (стилизованный меч) -->
            <div class="product-image">
                <svg viewBox="0 0 240 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="blade" x1="20" y1="80" x2="200" y2="40" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#d4dce0"/>
                            <stop offset="40%" stop-color="#f2f7fa"/>
                            <stop offset="70%" stop-color="#b0c2c9"/>
                            <stop offset="100%" stop-color="#8b9da5"/>
                        </linearGradient>
                        <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#4d3a2b"/>
                            <stop offset="100%" stop-color="#2f2218"/>
                        </linearGradient>
                    </defs>
                    <!-- клинок -->
                    <path d="M95 18 L118 12 L130 28 L140 14 L155 24 L138 44 L148 58 L128 68 L118 82 L104 72 L88 80 L78 62 L60 54 L68 40 L48 30 L62 16 L78 24 L92 8 L95 18Z"
                        fill="url(#blade)" stroke="#424f54" stroke-width="1.2" stroke-linejoin="round"/>
                    <!-- гарда -->
                    <rect x="70" y="72" width="64" height="12" rx="3" fill="#2f2218" stroke="#1d140e" stroke-width="1.5"/>
                    <rect x="80" y="68" width="44" height="6" rx="2" fill="#4d3a2b" stroke="#1d140e" stroke-width="1"/>
                    <!-- рукоять -->
                    <rect x="86" y="80" width="32" height="30" rx="6" fill="url(#handle)" stroke="#1d140e" stroke-width="1.5"/>
                    <!-- навершие -->
                    <circle cx="102" cy="114" r="8" fill="#4d3a2b" stroke="#1d140e" stroke-width="1.8"/>
                    <circle cx="102" cy="114" r="3" fill="#b48b5a" stroke="#1d140e" stroke-width="1"/>
                    <!-- акцент на клинке -->
                    <path d="M112 44 L128 40 L132 46 L118 52 L112 44Z" fill="#e0ecf0" opacity="0.5"/>
                    <path d="M82 26 L96 16 L104 22 L92 34 L82 26Z" fill="#e0ecf0" opacity="0.4"/>
                    <!-- крестовина / декоративная вставка -->
                    <rect x="92" y="72" width="20" height="8" rx="2" fill="#b48b5a" opacity="0.8" stroke="#2f2218" stroke-width="1"/>
                </svg>
            </div>

            <!-- информация о товаре -->
            <div class="product-details">
                <!-- Название + артикул (декор) -->
                <div class="product-name">
                    <span>{{name}}</span>
                    <small>арт. DW-07</small>
                </div>

                <!-- Цена -->
                <div class="price-block">
                    <span class="price-label">Цена</span>
                    <span class="price-value">
                        {{price}} <span class="currency">₽</span>
                    </span>
                </div>

                <!-- Количество в наличии -->
                <div class="stock-block">
                    <span class="stock-label">В наличии</span>
                    <span class="stock-count">
                        {{count}} <span>шт.</span>
                    </span>
                </div>

                <!-- дополнительный индикатор (ограниченная партия) -->
                <div style="display: flex; justify-content: flex-end; margin-top: -0.4rem;">
                    <span class="badge-limited">🔥 осталось мало</span>
                </div>

                <!-- кнопка (декоративная, без функционала) -->
                <div class="action-btn">
                    <svg viewBox="0 0 24 24" width="24" height="24">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                    Забрать в оружейной
                </div>
            </div>
        </div>

        <!-- подвал -->
        <div class="footer-note">
            ⚡ только один предмет в ассортименте
        </div>
    </div>

</body>
</html>
