<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поздравление с регистрацией</title>
    <style>
        /* Сброс стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Анимированные фоновые круги */
        body::before,
        body::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 8s ease-in-out infinite;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: #764ba2;
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        body::after {
            width: 300px;
            height: 300px;
            background: #667eea;
            bottom: -80px;
            left: -80px;
            animation-delay: -4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(30px, -30px) scale(1.1);
            }
        }

        /* Основная карточка */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 50px 45px;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 1;
            backdrop-filter: blur(10px);
            animation: slideUp 0.8s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Иконка-эмодзи */
        .icon {
            text-align: center;
            font-size: 4.5rem;
            margin-bottom: 15px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        /* Заголовок */
        .title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.3;
        }

        /* Основной текст */
        .message {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #2d3748;
            text-align: center;
            padding: 25px 0;
            border-top: 2px solid #e2e8f0;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 25px;
        }

        .message .highlight-name {
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.25rem;
        }

        .message .highlight-event {
            font-weight: 700;
            color: #764ba2;
            font-size: 1.2rem;
        }

        /* Блок с билетом */
        .ticket-info {
            background: linear-gradient(135deg, #f8f7ff 0%, #f0edff 100%);
            border-radius: 16px;
            padding: 20px 25px;
            margin: 20px 0 25px;
            border-left: 5px solid #764ba2;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.1);
        }

        .ticket-info p {
            color: #4a5568;
            font-size: 1rem;
            line-height: 1.6;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ticket-info .ticket-icon {
            font-size: 1.5rem;
        }

        /* Декоративная линия */
        .divider {
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            margin: 0 auto 20px;
            border-radius: 2px;
        }

        /* Кнопка */
        .btn {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
            letter-spacing: 0.5px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-container {
            text-align: center;
            margin-top: 10px;
        }

        /* Адаптивность */
        @media (max-width: 640px) {
            .card {
                padding: 30px 20px;
            }

            .title {
                font-size: 1.6rem;
            }

            .message {
                font-size: 1rem;
                padding: 20px 0;
            }

            .message .highlight-name {
                font-size: 1.1rem;
            }

            .icon {
                font-size: 3.5rem;
            }

            .ticket-info {
                padding: 15px 18px;
            }

            .ticket-info p {
                font-size: 0.9rem;
            }

            .btn {
                padding: 12px 30px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 20px 15px;
            }

            .title {
                font-size: 1.3rem;
            }

            .message {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Иконка -->
        <div class="icon">🎉</div>

        <!-- Заголовок -->
        <h1 class="title">Поздравляем с регистрацией!</h1>

        <!-- Декоративная линия -->
        <div class="divider"></div>

        <!-- Основное сообщение -->
        <div class="message">
            <span class="highlight-name">{{ name }} {{ surname }}</span>
            <span style="color: #4a5568; -webkit-text-fill-color: #4a5568;">!</span>
            <br>
            <span style="color: #4a5568; -webkit-text-fill-color: #4a5568;">
                Вы успешно зарегистрировались на мероприятие
            </span>
            <br>
            <span class="highlight-event">"Зарница"</span>
            <span style="color: #4a5568; -webkit-text-fill-color: #4a5568;">.</span>
        </div>

        <!-- Информация о билете -->
        <div class="ticket-info">
            <p>
                <span class="ticket-icon">🎫</span>
                <span>
                    <strong>Вам выдадут билет</strong> с вашим именем и фамилией
                    после того как покажете это сообщение!
                </span>
            </p>
        </div>

        <!-- Кнопка (опционально) -->
        <div class="btn-container">
            <a href="#" class="btn">Перейти к билету</a>
        </div>
    </div>
</body>
</html>
