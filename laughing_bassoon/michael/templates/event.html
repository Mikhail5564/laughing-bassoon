<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма ввода</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0d0b1a, #1a1040);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-container {
            background: linear-gradient(145deg, #2a1f5e, #1a2a6c);
            padding: 50px 60px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(60, 20, 120, 0.6), 0 0 30px #3b1f8e;
            border: 1px solid #7a4bca;
            max-width: 480px;
            width: 100%;
            transition: 0.3s;
        }

        .form-container:hover {
            box-shadow: 0 20px 50px rgba(90, 40, 180, 0.8), 0 0 50px #4f2fbb;
        }

        .form-title {
            text-align: center;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 35px;
            color: #d4bfff;
            text-shadow: 0 0 12px #7a4bca, 0 0 24px #3f1f99;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 28px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #c9aeff;
            font-size: 16px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 6px #4a2a8a;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(20, 10, 50, 0.7);
            border: 2px solid #5a3a9a;
            border-radius: 14px;
            font-size: 16px;
            color: #e8ddff;
            outline: none;
            transition: 0.3s;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .form-group input::placeholder {
            color: #8a7abb;
            font-weight: 300;
        }

        .form-group input:focus {
            border-color: #9f6eff;
            box-shadow: 0 0 20px #6a3fd0, inset 0 0 10px #6a3fd0;
            background: rgba(30, 15, 70, 0.8);
            transform: scale(1.01);
        }

        .form-group input:hover {
            border-color: #7f5bd0;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6a3fd0, #2f4fcf);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 6px 0 #1a1a6a, 0 10px 30px #3a1f8a;
            text-shadow: 0 1px 4px rgba(0,0,0,0.3);
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 0 #1a1a6a, 0 18px 40px #4f2fbb;
            background: linear-gradient(135deg, #7a4fe0, #3f5fdf);
        }

        .submit-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1a1a6a, 0 8px 20px #3a1f8a;
        }

        .submit-btn:focus {
            outline: 2px solid #b28aff;
            outline-offset: 4px;
        }

        /* Дополнительная сине-фиолетовая атмосфера */
        .form-container::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 28px;
            background: linear-gradient(45deg, #5f2fbf, #2f4fcf, #7f4fdf, #2f2f9f);
            background-size: 300% 300%;
            z-index: -1;
            animation: glowBorder 6s ease-in-out infinite;
            filter: blur(12px);
            opacity: 0.6;
        }

        .form-container {
            position: relative;
            z-index: 1;
        }

        @keyframes glowBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 class="form-title">✧ Личные данные ✧</h2>
        <form method="post" action="#">
            {% csrf_token %}
            <!-- Поле для имени -->
            <div class="form-group">
                <label for="first_name">Имя</label>
                <input type="text" id="first_name" name="first_name" placeholder="Введите ваше имя" required>
            </div>
            <!-- Поле для фамилии -->
            <div class="form-group">
                <label for="last_name">Фамилия</label>
                <input type="text" id="last_name" name="last_name" placeholder="Введите вашу фамилию" required>
            </div>
            <!-- Кнопка отправки -->
            <button type="submit" class="submit-btn">Отправить</button>
        </form>
    </div>

</body>
</html>
