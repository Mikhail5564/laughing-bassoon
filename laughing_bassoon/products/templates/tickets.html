<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Регистрация | Зимето</title>
    <!-- Google Fonts для красивого шрифта -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
            padding: 1.5rem;
        }

        .card {
            max-width: 520px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 2.5rem 2.2rem 2.8rem;
            box-shadow: 0 25px 50px -12px rgba(0, 20, 30, 0.25),
                        0 4px 18px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: transform 0.25s ease;
        }

        .card:hover {
            transform: scale(1.005);
        }

        /* Заголовок */
        .event-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 0.25rem;
        }

        .event-title {
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0b2b3b;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .event-title small {
            font-weight: 400;
            font-size: 1rem;
            color: #4b6b7b;
            margin-left: 0.2rem;
        }

        .ticket-badge {
            background: #1e4a5f;
            color: white;
            padding: 0.35rem 1rem;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            box-shadow: 0 6px 14px rgba(22, 78, 99, 0.2);
            white-space: nowrap;
        }

        .ticket-badge span {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .sub-message {
            font-size: 0.95rem;
            color: #b13e3e;
            background: #ffe8e8;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            display: inline-block;
            margin-top: 0.5rem;
            font-weight: 500;
            border: 1px solid #ffc9c9;
        }

        hr {
            margin: 1.5rem 0 2rem;
            border: none;
            height: 2px;
            background: linear-gradient(90deg, #d0e0e8, #b0c8d4, #d0e0e8);
            opacity: 0.5;
        }

        /* Форма */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #2b4a5a;
            margin-bottom: 0.3rem;
        }

        input {
            width: 100%;
            padding: 0.85rem 1.2rem;
            font-size: 1rem;
            font-weight: 500;
            border: 2px solid #dde7ed;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: border 0.2s, box-shadow 0.2s;
            outline: none;
            color: #12303e;
        }

        input:focus {
            border-color: #1f6f8f;
            box-shadow: 0 0 0 4px rgba(28, 110, 144, 0.15);
            background: white;
        }

        input::placeholder {
            color: #9bb3c0;
            font-weight: 400;
        }

        /* Кнопка */
        .btn-register {
            width: 100%;
            padding: 0.95rem;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            background: #1b5a74;
            color: white;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 12px 24px -8px rgba(22, 78, 99, 0.3);
            letter-spacing: 0.3px;
            margin-top: 0.5rem;
        }

        .btn-register:hover {
            background: #134a61;
            transform: scale(1.01);
            box-shadow: 0 16px 30px -8px rgba(18, 65, 84, 0.4);
        }

        .btn-register:active {
            transform: scale(0.98);
            background: #0d3d51;
        }

        /* ссылка (если нужна) */
        .footnote {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: #5a7a8a;
            border-top: 1px solid rgba(180, 200, 210, 0.4);
            padding-top: 1.5rem;
        }

        .footnote a {
            color: #1b5a74;
            text-decoration: none;
            font-weight: 600;
        }

        .footnote a:hover {
            text-decoration: underline;
        }

        /* адаптив */
        @media (max-width: 480px) {
            .card {
                padding: 1.8rem 1.2rem;
            }
            .event-title {
                font-size: 1.6rem;
            }
            .ticket-badge {
                font-size: 0.75rem;
                padding: 0.2rem 0.8rem;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <!-- Заголовок + статус билетов -->
    <div class="event-header">
        <div class="event-title">
            🎫 Зимето
            <small>вечеринка</small>
        </div>
        <div class="ticket-badge">
            осталось <span>{{ ticket_used }}</span> из {{ total_tickets }}
        </div>
    </div>

    <!-- Сообщение "Зимето нет" — если мероприятие отменено/закрыто -->
    <hr />

    <!-- Форма регистрации -->
    <form method="post" action="">
        {% csrf_token %}
        <p style="color: red">{{error}}</p>
        <div class="form-group">
            <label for="id_first_name">Имя</label>
            <input type="text" id="id_first_name" name="first_name" placeholder="Алексей" required />
        </div>

        <div class="form-group">
            <label for="id_last_name">Фамилия</label>
            <input type="text" id="id_last_name" name="last_name" placeholder="Иванов" required />
        </div>

        <div class="form-group">
            <label for="id_age">Возраст</label>
            <input type="number" id="id_age" name="age" placeholder="25" min="1" max="120" required />
        </div>

        <button type="submit" class="btn-register">
            Зарегистрироваться
        </button>
    </form>
</div>

</body>
</html>
