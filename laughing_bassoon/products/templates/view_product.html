<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} — Просмотр товара</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 45px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .back-link:hover {
            color: #764ba2;
            transform: translateX(-5px);
        }

        .back-link::before {
            content: '← ';
        }

        h1 {
            color: #333;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 3px solid #f0f0f0;
        }

        .product-id {
            color: #999;
            font-size: 14px;
            font-weight: 400;
            margin-left: 10px;
        }

        .description-box {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0 30px 0;
            color: #555;
            font-size: 16px;
            line-height: 1.6;
            border-left: 4px solid #667eea;
        }

        .description-box.empty {
            color: #aaa;
            font-style: italic;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-item {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 18px 20px;
            transition: all 0.3s ease;
        }

        .info-item:hover {
            background: #f0f2ff;
        }

        .info-label {
            display: block;
            color: #888;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }

        .info-value {
            display: block;
            font-size: 28px;
            font-weight: 700;
            color: #333;
        }

        .info-value.quantity {
            color: #667eea;
        }

        .info-value.price {
            color: #27ae60;
        }

        .info-value.price::before {
            content: '₽ ';
            font-size: 20px;
        }

        /* Редактируемые поля */
        .editable-field {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 5px;
        }

        .editable-field input {
            width: 100px;
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            color: #333;
            transition: all 0.3s ease;
            background: white;
        }

        .editable-field input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .editable-field input.input-quantity {
            color: #667eea;
        }

        .editable-field input.input-price {
            color: #27ae60;
        }

        .editable-field .currency-symbol {
            font-size: 20px;
            font-weight: 700;
            color: #27ae60;
        }

        .save-btn {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .save-btn:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .save-btn:active {
            transform: translateY(0);
        }

        .save-btn.saved {
            background: #27ae60;
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #f0f0f0;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 30px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            text-align: center;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(231, 76, 60, 0.3);
        }

        /* Тосты/уведомления */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #27ae60;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transform: translateX(120%);
            transition: transform 0.5s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(0);
        }

        .toast.error {
            background: #e74c3c;
        }

        /* Адаптивность */
        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }

            .info-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .info-value {
                font-size: 22px;
            }

            .editable-field {
                flex-wrap: wrap;
            }

            .editable-field input {
                width: 80px;
                font-size: 16px;
            }

            .action-buttons {
                flex-direction: column;
                align-items: stretch;
            }

            .btn {
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Кнопка назад -->
        <a href="{% url 'views_products' %}" class="back-link">Назад к списку</a>

        <!-- Заголовок с названием товара -->
        <h1>
            {{ product.name }}
            <span class="product-id">#{{ product.id|default:"—" }}</span>
        </h1>

        <!-- Описание товара -->
        <div class="description-box {% if not product.description %}empty{% endif %}">
            {% if product.description %}
                {{ product.description }}
            {% else %}
                Описание отсутствует
            {% endif %}
        </div>

        <!-- Информация о товаре с редактируемыми полями -->
        <div class="info-grid">
            <!-- Количество -->
            <div class="info-item">
                <span class="info-label">Количество</span>
                <div class="editable-field">
                    <input
                        type="number"
                        class="input-quantity"
                        id="countInput"
                        value="{{ product.count }}"
                        min="0"
                        step="1"
                    >
                    <button class="save-btn" data-field="count" data-id="{{ product.id|default:'' }}">
                        Сохранить
                    </button>
                </div>
                <span class="info-value quantity" id="countDisplay">{{ product.count }}</span>
            </div>

            <!-- Цена -->
            <div class="info-item">
                <span class="info-label">Цена</span>
                <div class="editable-field">
                    <input
                        type="number"
                        class="input-price"
                        id="priceInput"
                        value="{{ product.price }}"
                        min="0"
                        step="0.01"
                    >
                    <span class="currency-symbol">₽</span>
                    <button class="save-btn" data-field="price" data-id="{{ product.id|default:'' }}">
                        Сохранить
                    </button>
                </div>
                <span class="info-value price" id="priceDisplay">{{ product.price }}</span>
            </div>
        </div>

        <!-- Кнопки действий -->
        <div class="action-buttons">
            <a href="" class="btn btn-primary">
                ✏️ Редактировать
            </a>
            <a href="{% url 'views_products' %}" class="btn btn-secondary">
                📋 Все товары
            </a>
            <button class="btn btn-danger" onclick="if(confirm('Удалить товар «{{ product.name }}»?')){ window.location.href='' }">
                🗑️ Удалить
            </button>
        </div>
    </div>

    <!-- Тост для уведомлений -->
    <div class="toast" id="toast"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const saveButtons = document.querySelectorAll('.save-btn');

            saveButtons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();

                    const field = this.dataset.field;
                    const productId = this.dataset.id;
                    const input = document.getElementById(field + 'Input');
                    const display = document.getElementById(field + 'Display');
                    const value = input.value.trim();

                    // Валидация
                    if (value === '' || isNaN(value) || parseFloat(value) < 0) {
                        showToast('Введите корректное значение', 'error');
                        return;
                    }

                    const numericValue = parseFloat(value);

                    // Имитация отправки на сервер
                    // В реальном проекте здесь будет AJAX-запрос
                    this.textContent = '⏳ Сохранение...';
                    this.disabled = true;

                    setTimeout(() => {
                        // Обновляем отображение
                        if (field === 'count') {
                            display.textContent = numericValue;
                        } else if (field === 'price') {
                            display.textContent = numericValue;
                        }

                        // Визуальный фидбэк
                        this.textContent = '✅ Сохранено';
                        this.classList.add('saved');

                        showToast(`${field === 'count' ? 'Количество' : 'Цена'} обновлено: ${numericValue}`);

                        setTimeout(() => {
                            this.textContent = 'Сохранить';
                            this.classList.remove('saved');
                            this.disabled = false;
                        }, 2000);
                    }, 800);
                });
            });

            // Поддержка Enter в полях ввода
            document.querySelectorAll('.editable-field input').forEach(input => {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        const btn = this.closest('.editable-field').querySelector('.save-btn');
                        if (btn) btn.click();
                    }
                });
            });

            // Функция показа тоста
            function showToast(message, type = 'success') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = 'toast';

                if (type === 'error') {
                    toast.classList.add('error');
                }

                // Показываем
                setTimeout(() => {
                    toast.classList.add('show');
                }, 10);

                // Скрываем через 3 секунды
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
        });
    </script>

</body>
</html>
