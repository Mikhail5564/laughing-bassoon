<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка участника</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 20px;
        }

        .member-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 32px 40px 28px;
            width: 420px;
            max-width: 100%;
            transition: box-shadow 0.2s;
        }

        .member-card:hover {
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.12);
        }

        .field {
            display: flex;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .field:last-of-type {
            border-bottom: none;
        }

        .field-label {
            font-size: 15px;
            color: #8e8e93;
            width: 100px;
            flex-shrink: 0;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .field-value {
            font-size: 16px;
            color: #1c1c1e;
            font-weight: 500;
            padding: 4px 0;
            flex: 1;
        }

        .field-value.editable {
            color: #007aff;
            background: transparent;
            border: none;
            font-size: 16px;
            font-weight: 500;
            font-family: inherit;
            padding: 4px 0;
            width: 100%;
            outline: none;
            border-bottom: 1.5px dashed transparent;
            transition: border-color 0.2s;
        }

        .field-value.editable:hover {
            border-bottom-color: #007aff40;
        }

        .field-value.editable:focus {
            border-bottom-color: #007aff;
        }

        .editable-badge {
            font-size: 12px;
            color: #8e8e93;
            background: #f2f2f7;
            padding: 2px 10px;
            border-radius: 12px;
            margin-left: 12px;
            font-weight: 400;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e5e5ea;
        }

        .btn {
            padding: 10px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        .btn-save {
            background: #007aff;
            color: white;
        }

        .btn-save:hover {
            background: #0066d9;
            transform: scale(1.02);
        }

        .btn-save:active {
            transform: scale(0.98);
        }

        .btn-cancel {
            background: transparent;
            color: #8e8e93;
            border: 1px solid #e5e5ea;
        }

        .btn-cancel:hover {
            background: #f8f8f8;
            border-color: #d1d1d6;
        }

        .btn-cancel:active {
            background: #f0f0f0;
        }

        @media (max-width: 480px) {
            .member-card {
                padding: 20px;
            }

            .field {
                flex-wrap: wrap;
                gap: 4px 0;
            }

            .field-label {
                width: 100%;
                font-size: 13px;
                color: #8e8e93;
            }

            .field-value {
                font-size: 15px;
                width: 100%;
            }

            .editable-badge {
                margin-left: 0;
                font-size: 11px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                text-align: center;
                padding: 12px;
            }
        }

        /* Для отображения как на скриншоте — заголовки без жирности */
        .field-label {
            font-weight: 400;
        }

        /* Специально для "Редактируемые" в углу */
        .edit-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .edit-indicator .editable-badge {
            background: #e8f0fe;
            color: #007aff;
        }
    </style>
</head>
<body>

    <div class="member-card">
        <!-- Имя -->
        <div class="field">
            <span class="field-label">имя</span>
            <span class="field-value">{{ member.first_name }}</span>
            <span class="editable-badge">Редактируемые</span>
        </div>

        <!-- Фамилия -->
        <div class="field">
            <span class="field-label">фамилия</span>
            <span class="field-value">{{ member.last_name }}</span>
            <span class="editable-badge">Редактируемые</span>
        </div>

        <!-- Возраст -->
        <div class="field">
            <span class="field-label">Возраст</span>
            <span class="field-value">{{ member.age }}</span>
            <span class="editable-badge">Редактируемые</span>
        </div>

        <!-- Кнопки действий -->
        <div class="actions">
            <button class="btn btn-save">сохранить изменения</button>
            <button class="btn btn-cancel">удалить пользователя</button>
        </div>
    </div>

</body>
</html>
